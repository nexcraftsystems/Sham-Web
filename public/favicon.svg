<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1608" />
      <stop offset="70%" stop-color="#070707" />
      <stop offset="100%" stop-color="#020202" />
    </radialGradient>
    
    <!-- Gold Ring & Accents -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Silver Metallic Gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Specular Highlight Filters -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGlow)" stroke="url(#goldGradient)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" opacity="0.6" stroke-dasharray="2 3" />

  <!-- Monogram: Silver 'L' -->
  <!-- Vertical stem of L -->
  <path d="M 36 28 L 52 28 L 52 74 L 78 74 L 78 88 L 36 88 Z" fill="url(#silverGradient)" stroke="#ffffff" stroke-width="0.5" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.8))" />
  <!-- Serif top accent on L -->
  <path d="M 32 28 L 56 28 L 56 34 L 32 34 Z" fill="url(#silverGradient)" opacity="0.9" />

  <!-- Monogram: Gold 'X' -->
  <!-- Diagonal 1 (Top-Left to Bottom-Right) -->
  <path d="M 54 30 L 70 30 L 98 88 L 82 88 Z" fill="url(#goldGradient)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.9))" />
  <!-- Diagonal 2 (Top-Right to Bottom-Left) -->
  <path d="M 96 30 L 80 30 L 52 88 L 68 88 Z" fill="url(#goldGradient)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.9))" />

  <!-- Tiny Gold Star Accent -->
  <circle cx="98" cy="30" r="2.5" fill="#fef08a" filter="url(#goldGlow)" />
</svg>
